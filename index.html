<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Wind Check</title>
<meta name="description" content="Instant wind direction and speed for your location.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0e2417">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wind Check">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: #0e2417;
    color: #f2f5f0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100dvh;
    padding: env(safe-area-inset-top) 20px env(safe-area-inset-bottom);
    text-align: center;
    user-select: none; -webkit-user-select: none;
  }
  #from-label { font-size: clamp(20px, 6vw, 28px); letter-spacing: .35em; text-transform: uppercase; color: #b9c9b4; text-indent: .35em; }
  #compass-point { font-size: clamp(84px, 30vw, 150px); font-weight: 800; line-height: 1; margin-top: 2px; }
  #compass-deg { font-size: clamp(20px, 6vw, 28px); color: #b9c9b4; margin-top: 4px; }
  #dial-wrap { position: relative; width: min(62vw, 250px); height: min(62vw, 250px); margin: 22px 0 4px; }
  #lubber {
    position: absolute; left: 50%; top: -14px; transform: translateX(-50%);
    width: 0; height: 0; z-index: 2;
    border-left: 11px solid transparent; border-right: 11px solid transparent;
    border-top: 16px solid #f2f5f0;
  }
  #rotor { position: absolute; inset: 0; will-change: transform; }
  #dial-svg { width: 100%; height: 100%; display: block; }
  #facing { font-size: clamp(17px, 5vw, 22px); color: #f2f5f0; margin-top: 10px; min-height: 1.3em; font-weight: 600; }
  #facing span { color: #b9c9b4; font-weight: 400; }
  #speed-row { display: flex; align-items: baseline; gap: 10px; margin-top: 8px; }
  #speed { font-size: clamp(72px, 26vw, 120px); font-weight: 800; line-height: 1; }
  #speed-unit { font-size: clamp(24px, 7vw, 34px); color: #b9c9b4; font-weight: 600; }
  #gusts { font-size: clamp(19px, 5.5vw, 25px); color: #b9c9b4; margin-top: 8px; min-height: 1.3em; }
  #gusts b { color: #ffb37a; font-weight: 700; }
  #status { margin-top: 22px; font-size: 15px; color: #8fa388; min-height: 1.3em; padding: 0 10px; }
  .btnrow { display: flex; gap: 12px; margin-top: 14px; flex-wrap: wrap; justify-content: center; }
  .btn {
    background: rgba(242,245,240,.08); color: #f2f5f0;
    border: 1px solid rgba(242,245,240,.25); border-radius: 999px;
    font-size: 17px; font-weight: 600; padding: 12px 30px; cursor: pointer;
  }
  .btn:active { background: rgba(242,245,240,.18); }
  #compass-btn { display: none; border-color: #ff7a1a; color: #ffb37a; }
</style>
</head>
<body>
  <div id="from-label">Wind from</div>
  <div id="compass-point">--</div>
  <div id="compass-deg">&nbsp;</div>

  <div id="dial-wrap">
    <div id="lubber"></div>
    <div id="rotor">
      <svg id="dial-svg" viewBox="0 0 200 200" aria-hidden="true">
        <circle cx="100" cy="100" r="96" fill="none" stroke="rgba(242,245,240,.25)" stroke-width="2"/>
        <g id="ticks"></g>
        <text x="100" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#f2f5f0">N</text>
        <text x="176" y="107" text-anchor="middle" font-size="15" font-weight="700" fill="#b9c9b4">E</text>
        <text x="100" y="186" text-anchor="middle" font-size="15" font-weight="700" fill="#b9c9b4">S</text>
        <text x="24" y="107" text-anchor="middle" font-size="15" font-weight="700" fill="#b9c9b4">W</text>
        <g id="wind-arrow">
          <rect x="96.5" y="40" width="7" height="86" rx="3.5" fill="#ff7a1a"/>
          <polygon points="100,8 79,42 121,42" fill="#ff7a1a"/>
          <polygon points="100,138 83,114 117,114" fill="rgba(255,122,26,.55)"/>
          <circle cx="100" cy="100" r="6.5" fill="#f2f5f0"/>
        </g>
      </svg>
    </div>
  </div>
  <div id="facing">&nbsp;</div>

  <div id="speed-row"><span id="speed">--</span><span id="speed-unit">mph</span></div>
  <div id="gusts">&nbsp;</div>

  <div id="status">Getting your location…</div>
  <div class="btnrow">
    <button id="compass-btn" class="btn" type="button">Enable Live Compass</button>
    <button id="refresh" class="btn" type="button">Refresh</button>
  </div>

<script src="app.js"></script>
</body>
</html>
